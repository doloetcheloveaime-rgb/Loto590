<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOTO590</title><style>body{font-family:Arial;background:#111;color:#fff;text-align:center}button{padding:10px;margin:3px;border:none;border-radius:8px;font-weight:bold}.num{background:#fff;color:#000;width:52px;height:52px}.sel{background:#ff2d95!important;color:#fff!important}#app{display:none}.box{background:#222;padding:10px;border-radius:10px;margin:10px}input{padding:10px;width:80%;border-radius:8px;border:none}</style></head><body>
<div id="login"><h1>LOTO590</h1><input id="u" placeholder="Nom"><br><br><input id="p" type="password" placeholder="Mot de passe"><br><br><button onclick="login()" style="background:#ff2d95;color:#fff;width:85%">ENTRER</button></div><div id="app"><h2>LOTO590</h2><div class="box"><b>Selection:</b><div id="selNums"></div><div id="pave"></div><button id="btnEff" style="background:#ff2d95;color:#fff;width:100%">EFFACER</button></div><div class="box"><b>Type:</b><br><button onclick="setType('NAP')">NAP</button><button onclick="setType('AGAINST')">AGAINST</button><button onclick="setType('TWO SURE')">TWO SURE</button><div id="typeTxt">Type: NAP</div><label>Mise: </label><input id="mise" value="25" style="width:60px"><br><span id="totalTxt"></span></div><div class="box"><h3>COUPON</h3><div id="listeCoupons"></div><button onclick="ajouterCoupon()" style="background:green;color:#fff">AJOUTER COUPON</button><button onclick="validerCoupon()" style="background:orange;color:#000">VALIDER COUPON</button></div></div>
<script>let type='NAP';let nums=[];function login(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block'}let pave=document.getElementById('pave');for(let i=1;i<=90;i++){let b=document.createElement('button');b.className='num';b.textContent=i;b.onclick=function(){if(nums.includes(i)){nums=nums.filter(n=>n!==i);b.classList.remove('sel')}else{nums.push(i);b.classList.add('sel')}aff()};pave.appendChild(b)}function aff(){document.getElementById('selNums').textContent=nums.join(' - ');let t='';if(type==='NAP'){t='NAP '+nums.length+' numeros'}if(type==='AGAINST'&&nums.length>1){t='AGAINST: '+nums[0]+' en haut, reste en bas = '+(nums.length-1)+' x NAP 2, Total='+(nums.length-1)*parseInt(document.getElementById('mise').value||25)+'F'}if(type==='TWO SURE'){t='TWO SURE: '+nums.join('-')}document.getElementById('typeTxt').textContent='Type: '+type;document.getElementById('totalTxt').textContent=t}
function setType(v){type=v;aff()}document.getElementById('btnEff').onclick=function(){if(nums.length>0){let last=nums.pop();let btns=pave.children;for(let b of btns){if(parseInt(b.textContent)===last)b.classList.remove('sel')}aff()}};document.getElementById('mise').oninput=function(){aff()};aff();
function ajouterCoupon(){if(nums.length===0){alert('Choisis des numeros');return}let now=new Date();let ticket='AT590-'+Math.floor(100000+Math.random()*900000);let d=document.createElement('div');d.style.cssText='background:#fff;color:#000;padding:8px;border-radius:8px;margin:5px;text-align:left';d.innerHTML='Ticket: '+ticket+'<br>Date: '+now.toLocaleDateString()+' Heure: '+now.toLocaleTimeString()+'<br>Type: '+type+'<br>Numeros: '+nums.join(' - ')+'<br>Mise: '+document.getElementById('mise').value+'F';let x=document.createElement('button');x.textContent='X';x.style.cssText='background:red;color:#fff;float:right';x.onclick=function(){d.remove()};d.appendChild(x);document.getElementById('listeCoupons').appendChild(d)}function validerCoupon(){if(document.getElementById('listeCoupons').children.length===0){alert('Ajoute d abord un coupon');return}alert('Coupon valide - Bonne chance!')}
</script></body></html>
